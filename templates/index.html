<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text Summarizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen py-10 px-4">
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md p-8">
        <h1 class="text-3xl font-bold text-gray-800 text-center mb-6">AI Text Summarizer</h1>
        <form id="summarize-form" class="space-y-4">
            <div>
                <label for="text" class="block text-sm font-medium text-gray-700 mb-2">Input Text / Conversation:</label>
                <textarea id="text" name="text" rows="8" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Paste your text here..." required></textarea>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition duration-200">
                Generate Summary
            </button>
        </form>
        <div id="output-section" class="mt-8 hidden">
            <h2 class="text-xl font-semibold text-gray-800 mb-2">Summary Result:</h2>
            <div id="summary-result" class="p-4 bg-gray-50 border border-gray-200 rounded-lg text-gray-700 whitespace-pre-line"></div>
        </div>
    </div>
    <script>
        document.getElementById('summarize-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = document.getElementById('text').value;
            const outputSection = document.getElementById('output-section');
            const summaryResult = document.getElementById('summary-result');
            outputSection.classList.remove('hidden');
            summaryResult.textContent = 'Summarizing text... Please wait.';
            try {
                const formData = new FormData();
                formData.append('text', text);
                const response = await fetch('/predict', { method: 'POST', body: formData });
                const data = await response.json();
                summaryResult.textContent = response.ok ? data.summary : 'Error: ' + data;
            } catch (err) {
                summaryResult.textContent = 'Error generating summary.';
            }
        });
    </script>
</body>
</html>
